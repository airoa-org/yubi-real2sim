schema_version: 2
robot: fr3
name: strict-fixture
description: "Non-functional schema-v2 fixture for clean CI and release tooling."

runner:
  mode: sequential_waves
  repeats: 1
  policy_batch_size: 1
  frames: 1
  max_wall_sec: 60
  expected_rollouts: 1

policy:
  python: "{repo_root}/tests/fixtures/fake_policy_python.sh"
  checkpoint: "{repo_root}/tests/fixtures/artifacts/checkpoint"
  config_name: pi05_yubi_pickplace
  config_source: deploy
  action_horizon: 32
  exec_steps: 16
  noise_seed: 0
  deterministic_xla: true

task:
  objects: cup_plate
  instruction: "Place the cup on the plate."
  goal_condition: cup_on_plate
  score_condition: cup_on_plate_contact_points
  policy_image_episode: null

scenes:
  - tag: tiny_fixture_scene
    path: "{repo_root}/tests/fixtures/artifacts/scene"

simulation:
  deterministic: true
  seed: 0
  init_state: null
  rf_overlap: 0
  rf_overlap_sampler: single
  rf_overlap_prev_weight: null
  rf_overlap_step_shift: 0
  grip_torque_mult: 0.5
  gripper_calibration: "{repo_root}/robosuite_env/assets/gripper_calib_rad.json"
  fr3_controller: joint_ik
  fr3_nullspace: home
  yubi_controller: cbpc
  parameters:
    physics: dynamic
    grasp_mode: rule
    policy_anchor: ready
    initial_arm_joints_json: "{repo_root}/assets/initial_poses/fr3/flat/registered_cup_calibrated.json"
    policy_image_source: sim
    policy_image_resize: pad
    policy_wrist_contrast: 1.0
    policy_obs_inset: true
    policy_delta_anchor: observation
    policy_pose_source: sim
    policy_image_index: infer
    policy_image_loop: false
    no_obs_gs: false
    # The scene contract binds 3DGS appearance to the exact table collision.
    # No table visual mesh is compiled into MuJoCo.
    desk: scene
    desk_world_aligned: true
    dynamic_control_hz: 50
    frame_hz: 10
    dynamic_ready_sec: 12
    joint_ik_max_velocity: 0.7
    joint_ik_max_acceleration: 12.0
    joint_ik_max_jerk: 120.0
    joint_ik_nullspace_gain: 0.2
    joint_ik_ready_position_tol_mm: 5.0
    joint_ik_ready_orientation_tol_deg: 2.0
    dynamic_subframes: 1
    substeps: 10
    mujoco_integrator: implicitfast
    torque_scale: 1.0
    grip_friction: [0.25, 0.025, 0.0001]
    rubber_friction: [1.0, 0.05, 0.0001]
    solref: [0.04, 1.0]
    grip_priority: 1
    rubber_solref: [0.005, 1.0]
    rubber_solimp: [0.99, 0.999, 0.0001]
    rubber_priority: 3
    cup_mass: 0.0
    rule_grasp_hand: auto
    rule_grasp_effort_eps: 0.001
    rule_grasp_policy_eps_rad: 0.001
    rule_grasp_release_eps_rad: 0.05
    grasp_contact_tol_mm: 3.0
    debug_grasp_contact: false
    gs_render_timeout_sec: 30.0
    gs_render_attempts: 3
    gs_render_retry_delay_sec: 0.25
    gs_calibration_world_offset: [0.0, 0.0, 0.0]
    success_contact_tol_mm: 3.0
    success_contact_penetration_tol_mm: 5.0
    success_place_contact_penetration_tol_mm: 15.0
    success_plane_gap_tol_mm: 10.0
    success_plane_penetration_tol_mm: 2.0
    success_bottom_contact_tol_mm: 12.0
    success_footprint_slack_mm: 3.0
    success_upright_tol_deg: 35.0
    success_mode: bbox
    table_z: 0.0
    world_offset: [0.0, 0.0, 0.0]
    ik_jump_reject: retry-hold
    ik_jump_retries: 2

render:
  enabled: false
  view_azimuth: 270
  view_elevation: -20
  view_distance: 1.35
  view_lookat: [0.08, 0.18, 0.10]
  wrist: false
  wrist_gs: false
  origin: false
  analysis: false
  clean_video: true

runtime:
  server_host: 127.0.0.1
  server_port: 8765
  gs_port_base: 8321
  gs_cuda_devices: null
  policy_cuda_device: null
  sim_cuda_devices: null
  gs_start_timeout_sec: 60
  sim_num_threads: 1
  gaussian_wrapping_repo: "{repo_root}/tests/fixtures/artifacts/scene"

output:
  root: "{repo_root}/outputs"
  run_name: "strict_fixture_{timestamp}"

reproducibility:
  mode: fixture
  artifact_manifest: "{repo_root}/artifacts/manifest.yaml"
  artifacts:
    checkpoint: tiny-checkpoint-v1
    scene.tiny_fixture_scene: tiny-scene-v2
    registered-desk: tiny-registered-desk-v1
    runtime-assets: tiny-repository-assets-v1
    robot-assets: tiny-repository-assets-v1
    provenance.generator-input: tiny-policy-episode-v1
  lockfiles:
    - "{repo_root}/uv.lock"
  source_dependencies:
    - "{repo_root}"
  support_matrix: "{repo_root}/config/support-matrix.yaml"
  accelerator_profile: cpu-fixture
  environment:
    allowlist:
      - HOME
      - PATH
      - LANG
      - LC_ALL
      - TZ
      - TMPDIR
      - LD_LIBRARY_PATH
      - SSL_CERT_FILE
      - SSL_CERT_DIR
    required:
      - HOME
      - PATH
    values: {}
