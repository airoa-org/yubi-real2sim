schema_version: 1

# Only variables declared here may be expanded by artifact local_path fields.
# They locate content; credentials and signed URLs are forbidden in this file.
# REAL2SIM_INPUTS_ROOT is the single machine-local input root from .env; every
# production local_path below is written as "{inputs_root}/<layout>" where the
# layout is checkpoints/<name> or scenes/<scene>
# (docs/configuration.md#inputs-root). The template field resolves to the
# normalized REAL2SIM_INPUTS_ROOT value.
environment_allowlist:
  - REAL2SIM_INPUTS_ROOT
  - REAL2SIM_POLICY_EPISODE

