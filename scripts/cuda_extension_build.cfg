# pyproject.toml puts scripts/ on PYTHONPATH for these builds.
[global]
command_packages = cuda_extension_build

[build_ext]
include_dirs = ../../../../scripts

# Every uv build starts from an empty build/, because ninja ignores NVCC_PREPEND_FLAGS.
[aliases]
bdist_wheel = check_gaussian_wrapping clean --all build record_gaussian_build bdist_wheel
